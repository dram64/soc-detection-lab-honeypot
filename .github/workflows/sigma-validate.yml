name: Sigma Rule Validation

on:
  push:
    branches: [main]
    paths:
      - 'sigma/**'
      - '.github/workflows/sigma-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sigma/**'
      - '.github/workflows/sigma-validate.yml'

permissions:
  contents: read

jobs:
  sigma-validate:
    name: Validate + convert Sigma rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install sigma-cli + Elasticsearch backend (pinned)
        run: |
          pip install --upgrade pip
          pip install "sigma-cli==3.1.0" "pysigma==1.5.0" "pysigma-backend-elasticsearch==2.1.1"

      - name: Validate all rules (deployed and not-deployed)
        run: |
          set -e
          for rule in sigma/rules/*.yml sigma/rules/not-deployed/*.yml; do
            echo "==> sigma check $rule"
            sigma check --fail-on-error --fail-on-issues "$rule"
          done

      - name: Convert deployable rules to ES|QL through the Cowrie->ECS pipeline
        run: |
          set -e
          # The collection is converted together so correlation rules can resolve
          # their base rules across files.
          sigma convert -t esql -p sigma/pipelines/cowrie_ecs.yml sigma/rules/*.yml
