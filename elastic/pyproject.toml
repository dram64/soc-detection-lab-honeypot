[project]
name = "soc-elastic"
version = "0.1.0"
description = "Phase 2: offline replay of the archived Cowrie dataset into Elasticsearch + Sigma rule deployment to Kibana"
requires-python = ">=3.13"
authors = [{ name = "dram64" }]
license = { text = "MIT" }

# `soc-detection-dashboard` (../dashboard) supplies the production ADR-005
# password classifier + dictionary and the HAProxy record parser, so the replay
# applies exactly the same data-handling policy as the deployed pipeline.
# Install both editable: pip install -e ../dashboard -e ".[dev]"
dependencies = [
    "soc-detection-dashboard",
    "geoip2>=4.8",
    "requests>=2.32",
    "pysigma>=1.0,<2",
    "pysigma-backend-elasticsearch>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["soc_elastic*"]

[tool.setuptools.package-data]
soc_elastic = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["soc_elastic"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
