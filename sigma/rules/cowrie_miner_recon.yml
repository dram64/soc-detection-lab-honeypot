title: Crypto-Mining Host Reconnaissance Commands
id: b5eec7ec-aa02-4c81-aebc-bc11577761e7
status: experimental
description: |
  Commands that check for competing miner processes or count CPU cores,
  which is how cryptojacking bots size a host and look for rivals before
  dropping a miner. Written against commands observed in the archived dataset
  (e.g. "ps -ef | grep '[Mm]iner'", "cat /proc/cpuinfo | grep name | wc -l").
references:
  - https://attack.mitre.org/techniques/T1057/
  - https://attack.mitre.org/techniques/T1082/
author: dram64
date: 2026/09/19
tags:
  - attack.discovery
  - attack.t1057
  - attack.t1082
logsource:
  category: process_creation
  product: cowrie
detection:
  selection_event:
    eventid: 'cowrie.command.input'
  selection_competitor:
    input|contains:
      - '[Mm]iner'
      - 'xmrig'
  selection_core_count:
    input|contains|all:
      - '/proc/cpuinfo'
      - 'wc -l'
  condition: selection_event and (selection_competitor or selection_core_count)
falsepositives:
  - Administrators checking CPU count or hunting for miners themselves
level: medium
fields:
  - src_ip
  - session
  - input
