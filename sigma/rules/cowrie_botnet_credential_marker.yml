title: Known Botnet Credential Marker Used Against SSH (345gs5662d34)
id: e235dc7b-3dbe-43c4-88c3-38e33a85b080
status: experimental
description: |
  Login attempt using the username '345gs5662d34', a hard-coded credential
  string seen in 1,523 login events during this lab's 14-day Cowrie run and
  widely reported in public honeypot telemetry as a botnet marker (it is sent
  as both username and password). Written against events observed in the
  archived dataset. The attempted password is not matched on: it is outside
  the ADR-005 dictionary, so it is stored length-redacted.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: dram64
date: 2026/09/19
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: authentication
  product: cowrie
detection:
  selection:
    eventid:
      - 'cowrie.login.failed'
      - 'cowrie.login.success'
    username: '345gs5662d34'
  condition: selection
falsepositives:
  - None expected; the string is not a plausible legitimate account name
level: medium
fields:
  - src_ip
  - username
  - session
